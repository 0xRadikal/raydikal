<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-label="The yolk pasteurization step">
<title>The yolk pasteurization step</title>
<desc>Temperature-time curve: 1.5 min ramp to 62 C then 10 min hold, with log10 reductions in three matrices.</desc>
<rect width="1240" height="600" fill="#fbf7ef"/>
<style>text{font-family:Georgia,"Times New Roman",serif;fill:#12100c}.n{font-family:"DejaVu Sans Mono",Consolas,monospace}.fa{font-family:"DejaVu Sans","Noto Naskh Arabic",sans-serif}</style>
<text x="90" y="52" font-size="23">The yolk kill step</text>
<text x="90" y="75" font-size="13.5" fill="#5b5344">A 1.5-minute ramp to 62 &#176;C, then a 10-minute hold. Every value plotted is read from the code, not typed in.</text>
<line x1="110" y1="430.0" x2="710" y2="430.0" stroke="#d8cdb8" stroke-width="0.8" />
<text x="98" y="434.0" font-size="12.5" class="n" fill="#5b5344" text-anchor="end">20</text>
<line x1="110" y1="376.7" x2="710" y2="376.7" stroke="#d8cdb8" stroke-width="0.8" />
<text x="98" y="380.7" font-size="12.5" class="n" fill="#5b5344" text-anchor="end">30</text>
<line x1="110" y1="323.3" x2="710" y2="323.3" stroke="#d8cdb8" stroke-width="0.8" />
<text x="98" y="327.3" font-size="12.5" class="n" fill="#5b5344" text-anchor="end">40</text>
<line x1="110" y1="270.0" x2="710" y2="270.0" stroke="#d8cdb8" stroke-width="0.8" />
<text x="98" y="274.0" font-size="12.5" class="n" fill="#5b5344" text-anchor="end">50</text>
<line x1="110" y1="216.7" x2="710" y2="216.7" stroke="#d8cdb8" stroke-width="1.6"  stroke-dasharray='4 4'/>
<text x="98" y="220.7" font-size="12.5" class="n" fill="#5b5344" text-anchor="end">60</text>
<line x1="110" y1="163.3" x2="710" y2="163.3" stroke="#d8cdb8" stroke-width="0.8" />
<text x="98" y="167.3" font-size="12.5" class="n" fill="#5b5344" text-anchor="end">70</text>
<line x1="110" y1="110.0" x2="710" y2="110.0" stroke="#d8cdb8" stroke-width="0.8" />
<text x="98" y="114.0" font-size="12.5" class="n" fill="#5b5344" text-anchor="end">80</text>
<line x1="110.0" y1="430" x2="110.0" y2="436" stroke="#5b5344" stroke-width="1"/>
<text x="110.0" y="454" font-size="12.5" class="n" fill="#5b5344" text-anchor="middle">0</text>
<line x1="203.2" y1="430" x2="203.2" y2="436" stroke="#5b5344" stroke-width="1"/>
<text x="203.2" y="454" font-size="12.5" class="n" fill="#5b5344" text-anchor="middle">2</text>
<line x1="296.3" y1="430" x2="296.3" y2="436" stroke="#5b5344" stroke-width="1"/>
<text x="296.3" y="454" font-size="12.5" class="n" fill="#5b5344" text-anchor="middle">4</text>
<line x1="389.5" y1="430" x2="389.5" y2="436" stroke="#5b5344" stroke-width="1"/>
<text x="389.5" y="454" font-size="12.5" class="n" fill="#5b5344" text-anchor="middle">6</text>
<line x1="482.7" y1="430" x2="482.7" y2="436" stroke="#5b5344" stroke-width="1"/>
<text x="482.7" y="454" font-size="12.5" class="n" fill="#5b5344" text-anchor="middle">8</text>
<line x1="575.8" y1="430" x2="575.8" y2="436" stroke="#5b5344" stroke-width="1"/>
<text x="575.8" y="454" font-size="12.5" class="n" fill="#5b5344" text-anchor="middle">10</text>
<line x1="669.0" y1="430" x2="669.0" y2="436" stroke="#5b5344" stroke-width="1"/>
<text x="669.0" y="454" font-size="12.5" class="n" fill="#5b5344" text-anchor="middle">12</text>
<text x="410" y="478" font-size="13.5" fill="#5b5344" text-anchor="middle">minutes</text>
<text x="66" y="270" font-size="13.5" fill="#5b5344" text-anchor="middle" transform="rotate(-90 66 270)">&#176;C</text>
<rect x="110" y="110.0" width="600" height="53.3" fill="#a3401f" opacity="0.07"/>
<text x="120" y="155.3" font-size="12.5" fill="#a3401f">yolk begins to set &#8212; scrambled, not a drink</text>
<path d="M110.0,430.0 L179.9,206.0 L645.7,206.0" fill="none" stroke="#c8860d" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M179.9,206.0 L645.7,206.0 L645.7,430 L179.9,430 Z" fill="#f0b429" opacity="0.20"/>
<circle cx="179.9" cy="206.0" r="5" fill="#fbf7ef" stroke="#c8860d" stroke-width="2.5"/>
<circle cx="645.7" cy="206.0" r="5" fill="#c8860d"/>
<text x="187.9" y="192.0" font-size="14.5" class="n">62 &#176;C</text>
<text x="412.8" y="232.0" font-size="13.5" fill="#5b5344" text-anchor="middle">hold 10 min</text>
<text x="774" y="104" font-size="16">Log&#8321;&#8320; reduction achieved</text>
<text x="774" y="124" font-size="12.5" fill="#5b5344">same step, three published matrices</text>
<text x="774" y="154" font-size="13">liquid egg yolk, plain</text>
<rect x="774" y="162" width="250" height="13" fill="#d8cdb8" opacity="0.5" rx="2"/>
<rect x="774" y="162" width="250.0" height="13" fill="#1d6f63" rx="2"/>
<text x="1034" y="173" font-size="13" class="n">7.93</text>
<text x="774" y="206" font-size="13">egg yolk + 10% sucrose</text>
<rect x="774" y="214" width="250" height="13" fill="#d8cdb8" opacity="0.5" rx="2"/>
<rect x="774" y="214" width="207.1" height="13" fill="#1d6f63" rx="2"/>
<text x="1034" y="225" font-size="13" class="n">6.57</text>
<text x="774" y="258" font-size="13">egg yolk + 10% NaCl</text>
<rect x="774" y="266" width="250" height="13" fill="#d8cdb8" opacity="0.5" rx="2"/>
<rect x="774" y="266" width="169.3" height="13" fill="#1d6f63" rx="2"/>
<text x="1034" y="277" font-size="13" class="n">5.37</text>
<line x1="931.6" y1="160" x2="931.6" y2="276" stroke="#a3401f" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="937.6" y="294" font-size="12.5" fill="#a3401f">5-log target</text>
<text x="774" y="324" font-size="13" fill="#5b5344">Worst case is the salted matrix at 5.37</text>
<text x="774" y="343" font-size="13" fill="#5b5344">log&#8321;&#8320;, still above the 5-log target.</text>
<text x="774" y="362" font-size="13" fill="#5b5344">That margin is why salt and sugar are added</text>
<text x="774" y="381" font-size="13" fill="#5b5344">AFTER this step, never before it.</text>
<text x="90" y="556" font-size="13" fill="#a3401f">Modelled, not measured: no thermocouple data exists for this drink. The curve is the DESIGN intent,</text>
<text x="90" y="575" font-size="13" fill="#a3401f">and every thermal history in the code is marked provenance=ASSUMED, enforced by the type system.</text>
</svg>
