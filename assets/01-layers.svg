<line x1="90" y1="518" x2="1060" y2="518" stroke="#d8cdb8" stroke-width="1"/>
<text x="90" y="540" font-size="15.5"><tspan class="n">126.9 g</tspan> total, from <tspan font-style="italic">one</tspan> egg &#8212; yolk and white both used, plus 0.6 g cocoa and cardamom on top. Nothing is discarded.</text>
<text x="90" y="566" font-size="13.5" fill="#5b5344">Band heights are proportional to computed volume, not chosen for looks: the foam is 73% of the drink by volume and only 46% by mass.</text>
