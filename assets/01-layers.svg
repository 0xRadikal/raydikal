<path d="M306,227.3 H324 V225.2 H336" fill="none" stroke="#d8cdb8" stroke-width="1.2"/>
<text x="346" y="213.2" font-size="19">Meringue foam</text>
<text x="346" y="235.2" font-size="14.5" class="n" fill="#5b5344">58.90 g &#183; 169.9 mL &#183; 0.35 g/mL</text>
<text x="346" y="253.2" font-size="13" class="n" fill="#5b5344">73% of volume</text>
<path d="M306,412.2 H324 V410.0 H336" fill="none" stroke="#d8cdb8" stroke-width="1.2"/>
